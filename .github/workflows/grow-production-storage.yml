name: Plan or grow production storage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only plan, or owner-approved growth to 60 GB
        type: choice
        options: [inspect-plan, extend-to-60gb]
        default: inspect-plan
      confirmation:
        description: Only after owner cost approval, enter approve-60gb-monthly-volume
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-release-and-backup
  cancel-in-progress: false

jobs:
  storage:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-07-15
        with:
          version: 0.4.71
      - name: Inspect plan or perform explicitly approved extension
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STORAGE_GROW_MODE: ${{ inputs.mode }}
          STORAGE_GROW_CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/grow-fly-storage.mjs
      - name: Retain safe storage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-storage-growth
          path: .release-evidence/production-storage-growth.json
          retention-days: 30
          if-no-files-found: warn
