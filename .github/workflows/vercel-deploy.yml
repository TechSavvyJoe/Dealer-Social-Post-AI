name: CI & Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          
          # Pull existing project config if PROJECT_ID is set
          if [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            # First time deployment - let Vercel create the project
            npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --name="${VERCEL_PROJECT_NAME:-dealer-social-post-ai}"
          fi
