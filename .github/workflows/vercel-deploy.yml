name: CI & Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Prepare Vercel deployment flags
        run: |
          set -euo pipefail

          scope_arg=""
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            scope_arg="--scope $VERCEL_ORG_ID"
            echo "VERCEL_SCOPE_ARG=$scope_arg" >> "$GITHUB_ENV"
          fi

          if [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" $scope_arg --project "$VERCEL_PROJECT_ID"
            echo "VERCEL_PROJECT_FLAG=--project $VERCEL_PROJECT_ID" >> "$GITHUB_ENV"
          elif [ -n "${VERCEL_PROJECT_NAME:-}" ]; then
            echo "VERCEL_PROJECT_FLAG=--name $VERCEL_PROJECT_NAME" >> "$GITHUB_ENV"
          else
            echo "Configure either VERCEL_PROJECT_ID or VERCEL_PROJECT_NAME as a repository secret." >&2
            exit 1
          fi

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          scope_arg="${VERCEL_SCOPE_ARG:-}"
          project_flag="${VERCEL_PROJECT_FLAG:?VERCEL_PROJECT_FLAG was not set}"
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" $scope_arg $project_flag
