name: Fetch Fly Logs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-fly-logs.yml'

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Get Logs
        run: flyctl logs -a dealer-social-post-ai-production --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
