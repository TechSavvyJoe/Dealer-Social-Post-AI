name: Fetch Fly Logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-logs:
    # Fly credentials are scoped to the same protected environment as deploys.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up pinned flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-07-15
        with:
          version: 0.4.71
      - name: Get logs
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Production environment is missing FLY_API_TOKEN." >&2
            exit 1
          fi
          flyctl logs --app dealer-social-post-ai-production --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
