name: Deploy to Fly.io

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified backend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master 2026-07-15

      - name: Deploy backend
        run: flyctl deploy --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify direct backend readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 10 \
              https://dealer-social-post-ai-production.fly.dev/api/app/health \
              --output /tmp/fly-health.json; then
              grep --fixed-strings '"ok":true' /tmp/fly-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Fly readiness did not pass after deployment." >&2
          exit 1

      - name: Capture Fly diagnostics on failure
        if: failure()
        run: |
          flyctl status --app dealer-social-post-ai-production || true
          flyctl machine list --app dealer-social-post-ai-production || true
          flyctl logs --app dealer-social-post-ai-production --no-tail || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
