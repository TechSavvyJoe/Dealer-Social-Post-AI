name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Required-action SHA pinning (post tj-actions/changed-files Mar 2025).
# When you bump versions, paste the full 40-char SHA from the action's
# release page — not the tag.

jobs:
  typecheck-and-test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - run: npm run model-policy:check
      - run: npm run release:provider-canary:contract
      - run: npm run vercel-config:check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:stability
      - run: npm run build
        env:
          # Official public always-pass key. Production rejects this value.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_RELEASE_SHA: ${{ github.sha }}
      - run: npm run security:audit

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright e2e
        run: |
          if [ -d e2e ]; then
            npx playwright test
          else
            echo "No e2e/ directory present — skipping Playwright run."
          fi
        env:
          CI: true
          # Frontend-only smoke tests stub API routes; PocketBase is not required.

  container-smoke:
    name: production container + migration and backup safety
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            --build-arg VITE_RELEASE_SHA="$GITHUB_SHA" \
            --tag dealer-social-post-ai:ci .
          docker run --rm --entrypoint /bin/sh dealer-social-post-ai:ci \
            -c 'grep -Rqs --fixed-strings 1x00000000000000000000AA /pb/pb_public/assets'
      - name: Boot fresh database and verify protected routes
        run: |
          provider_stub_pid=""
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            if [ -n "$provider_stub_pid" ]; then
              kill "$provider_stub_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          node scripts/provider-stub.mjs >/tmp/provider-stub.log 2>&1 &
          provider_stub_pid="$!"
          release_sha="ci-fresh-${GITHUB_SHA}"
          restore_verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          container_id="$(docker run --detach \
            --add-host host.docker.internal:host-gateway \
            --env GEMINI_API_KEY=test-gemini-key \
            --env ALLOW_TEST_PROVIDER_ORIGIN=true \
            --env GEMINI_API_URL_BASE=http://host.docker.internal:18081/ \
            --env ADMIN_DEALER_CODE="${CI_ADMIN_DEALER_CODE:-CiAdmin7xQ2Z}" \
            --env LEGACY_CLIENT_COMPATIBILITY_ENABLED=true \
            --env POCKETBASE_R2_BACKUPS_ENABLED=true \
            --env POCKETBASE_BACKUP_LAST_VERIFIED_AT="$restore_verified_at" \
            --env POCKETBASE_BACKUP_VERIFIED_RELEASE_SHA="$release_sha" \
            --env RELEASE_SHA="$release_sha" \
            --publish 127.0.0.1:8090:8090 \
            dealer-social-post-ai:ci)"

          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18081/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18081/ready >/dev/null

          for attempt in $(seq 1 30); do
            if curl --silent --fail \
              http://127.0.0.1:8090/api/app/health \
              --output /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep --fixed-strings '"ok":true' /tmp/health.json
          grep --fixed-strings '"status":"verified"' /tmp/health.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8090/api/app/session)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8090/api/proxy/v1beta/files/not-real:download)" = "401"

          login_code="${CI_ADMIN_DEALER_CODE:-CiAdmin7xQ2Z}"
          test "$(curl --silent --output /tmp/login.json --cookie-jar /tmp/cookies.txt \
            --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"dealerCode\":\"${login_code}\"}" \
            http://127.0.0.1:8090/api/app/session)" = "200"
          session_cookie="$(awk '$6 == "dealer_session" { print $7 }' /tmp/cookies.txt)"
          test -n "$session_cookie"
          test "$(curl --silent --output /tmp/denied-model.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "Cookie: dealer_session=${session_cookie}" --data '{}' \
            http://127.0.0.1:8090/api/proxy/v1beta/models/not-allowlisted:generateContent)" = "403"
          grep --fixed-strings '"error":"Proxy method or path not allowed"' /tmp/denied-model.json
          if grep --fixed-strings 'Missing API path' /tmp/denied-model.json; then
            exit 1
          fi
          test "$(curl --silent --output /tmp/admin-health.json --write-out '%{http_code}' \
            --header "Cookie: dealer_session=${session_cookie}" \
            http://127.0.0.1:8090/api/app/health)" = "200"
          grep --fixed-strings '"checks"' /tmp/admin-health.json
          grep --fixed-strings '"off_box_restore_ready":true' /tmp/admin-health.json

          E2E_BASE_URL=http://127.0.0.1:8090 \
          E2E_REAL_POCKETBASE=true \
          E2E_ADMIN_CODE="$login_code" \
            npx playwright test e2e/real-pocketbase.spec.ts \
              --project=chromium-desktop-1440 \
              --project=webkit-desktop-1440 \
              --reporter=line

          sensitive_event_count="$(docker exec "$container_id" sqlite3 \
            /pb/pb_data/data.db \
            "SELECT COUNT(*) FROM client_error_events WHERE name LIKE '%1HGCM82633A004352%' OR payload LIKE '%1HGCM82633A004352%' OR payload LIKE '%MustNeverPersist%';")"
          test "$sensitive_event_count" = "0"

      - name: Upgrade an existing database and preserve canary data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/dirty-upgrade-smoke.sh dealer-social-post-ai:ci "$BASE_SHA"

      - name: Create, download, and restore a full PocketBase backup
        run: bash scripts/backup-restore-canary.sh dealer-social-post-ai:ci
