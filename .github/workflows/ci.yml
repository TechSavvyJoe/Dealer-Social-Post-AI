name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required-action SHA pinning (post tj-actions/changed-files Mar 2025).
# When you bump versions, paste the full 40-char SHA from the action's
# release page — not the tag.

jobs:
  typecheck-and-test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: |
          if [ -d e2e ]; then
            npx playwright test
          else
            echo "No e2e/ directory present — skipping Playwright run."
          fi
        env:
          CI: true
          # Frontend-only smoke tests stub API routes; PocketBase is not required.
