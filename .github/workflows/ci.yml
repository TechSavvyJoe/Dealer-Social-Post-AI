name: CI

on:
  push:
    branches: [main]
    # Docs-only commits must not start runners or a production deploy.
    # workflow_run on this workflow is what Deploy production listens for, so
    # skipping the run is what keeps a markdown push off Fly and Vercel.
    # Pull requests do not use paths-ignore: a skipped workflow leaves required
    # checks pending. PR docs-only changes skip jobs inside detect-changes
    # instead, which still reports those checks.
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/pull_request_template.md"
  # No base-branch filter here on purpose. `branches:` under pull_request
  # filters the PR's BASE, not its head, so `[main]` silently skipped every
  # stacked PR (a feature branch based on another feature branch). Those PRs
  # showed four green checks -- Socket Security and Vercel -- while typecheck,
  # vitest, Playwright and the container job never ran at all.
  # ready_for_review is not in the default set. Listing types replaces that
  # set, so opened, synchronize, and reopened stay explicit.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # WebKit and the 3x unit pass also run overnight. This cron is separate from
  # the backup, model-policy, and revision-observation schedules. Deploy
  # production ignores schedule events.
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # actions/cache writes the Playwright and node_modules caches.
  actions: write

# Covering every PR costs minutes, so supersede a PR's own in-flight run when
# it is pushed again. Pushes to main are never cancelled: Deploy production
# keys off a *completed* CI run for that head SHA, and cancelling one would
# silently skip a release. The nightly run has its own group so it cannot
# queue behind, or be queued behind, that release.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required-action SHA pinning (post tj-actions/changed-files Mar 2025).
# When you bump versions, paste the full 40-char SHA from the action's
# release page — not the tag.

jobs:
  # Decides which heavy lanes run. Job-level skips (a false if) report
  # "skipped", and branch protection treats that as success. A workflow-level
  # paths-ignore on pull_request would leave those checks pending instead.
  detect-changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.scope.outputs.unit }}
      stability: ${{ steps.scope.outputs.stability }}
      chromium: ${{ steps.scope.outputs.chromium }}
      webkit: ${{ steps.scope.outputs.webkit }}
      editor: ${{ steps.scope.outputs.editor }}
      container: ${{ steps.scope.outputs.container }}
      small: ${{ steps.scope.outputs.small }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      draft: ${{ steps.scope.outputs.draft }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'true' || 'false' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-runner-scope.sh

  typecheck-and-test:
    name: typecheck + vitest
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    # test:stability runs the whole suite three times on main and nightly.
    # Pull requests run it once. 20 minutes still covers the 3x pass.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache npm dependencies
        id: npm-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - name: Install npm dependencies
        if: steps.npm-deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - run: npm run model-policy:check
      - run: npm run skill:creative-director:check
      - run: npm run release:provider-canary:contract
      - run: npm run vercel-config:check
      - run: npm run format:check
      - run: npm run typecheck
      - name: Run the unit suite once
        if: needs.detect-changes.outputs.stability != 'true'
        run: npm test
      - name: Run the unit suite three times
        if: needs.detect-changes.outputs.stability == 'true'
        run: npm run test:stability
      - run: npm run build
        env:
          # Official public always-pass key. Production rejects this value.
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_RELEASE_SHA: ${{ github.sha }}
      - run: npm run security:audit

  launch-capacity:
    name: 25 dealerships / 250 users
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.small == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify pinned PocketBase executable
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.22.55/pocketbase_0.22.55_linux_amd64.zip \
            --output /tmp/launch-pocketbase.zip
          echo '2e404f98bc693cfa7c8160bc9f1903fc7dc448c4f6fe78128c0cd1561a2db46e  /tmp/launch-pocketbase.zip' | sha256sum -c -
          unzip -q /tmp/launch-pocketbase.zip -d /tmp/launch-pocketbase
      - name: Exercise tenant isolation and concurrent saves
        run: node scripts/launch-capacity-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Exercise guided connection encryption and transport
        run: node scripts/guided-connections-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Exercise large private payload transport and cleanup
        run: node scripts/safe-http-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Exercise pinned private media encoding and file cleanup
        run: node scripts/website-media-encoding-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Exercise Omni compatibility and recovery cleanup
        run: node scripts/omni-video-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Exercise low storage and recoverable post saves
        run: node scripts/media-storage-canary.mjs
        env:
          POCKETBASE_TEST_BINARY: /tmp/launch-pocketbase/pocketbase
      - name: Retain storage and save-recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-storage-and-save-recovery
          path: .release-evidence/media-storage-canary.json
          retention-days: 30
      - name: Retain redacted capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launch-capacity
          path: .release-evidence/launch-capacity.json
          retention-days: 30

  # The automation/ package is a self-contained Output.ai + Temporal worker that
  # requires Node >= 24 while the repo root pins Node 22. It is deliberately
  # excluded from the root tsconfig/vitest runs (adding it there breaks root
  # `npm ci`-based CI and therefore blocks Fly deploys, which trigger on CI
  # success). This job is its verification path — do NOT fold it into
  # typecheck-and-test.
  automation-checks:
    name: automation package (typecheck + vitest)
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.small == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: automation
      - run: npm run check
        working-directory: automation

  # Chromium shard names stay "Playwright chromium shard 1/2" and "2/2".
  # Pull requests run only these two. WebKit is a separate job so a skipped
  # WebKit lane cannot hide inside a successful Chromium matrix result.
  playwright-chromium:
    name: Playwright chromium shard ${{ matrix.shard }}/${{ matrix.shards }}
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.chromium == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shards: 2
          - shard: 2
            shards: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reserve browser diagnostic disk space
        run: |
          # These hosted-runner mobile SDKs are unused by this web-only job.
          # Keep Node, browser dependencies and test evidence intact.
          sudo rm -rf /usr/local/lib/android
          df -h / /tmp
          available=$(df -Pk /tmp | awk 'NR == 2 {print $4}')
          test "$available" -ge 2097152
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache npm dependencies
        id: npm-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - name: Install npm dependencies
        if: steps.npm-deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright operating-system dependencies
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright e2e
        run: |
          if [ -d e2e ]; then
            npx playwright test --project='chromium-*' \
              --shard=${{ matrix.shard }}/${{ matrix.shards }} \
              --grep-invert 'vehicle background controls preserve originals'
          else
            echo "No e2e/ directory present — skipping Playwright run."
          fi
        env:
          CI: true
          # Show worker test and fixture phases when browser progress stalls.
          DEBUG: pw:test
          # Frontend-only smoke tests stub API routes; PocketBase is not required.
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-chromium-shard-${{ matrix.shard }}-of-${{ matrix.shards }}-test-results
          path: test-results/
          retention-days: 7

  # One WebKit runner instead of four. Four shards were about 9 minutes each;
  # one runner replays that work once, with a single npm ci and browser install.
  # 45 minutes leaves room past the old 4 x 9 minute total. Pull requests skip
  # this job. Push to main, workflow_dispatch, and the nightly schedule run it.
  # The aggregate below treats a skip on push as failure, so a missed WebKit
  # lane cannot go green and deploy.
  playwright-webkit:
    name: Playwright webkit shard 1/1
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reserve browser diagnostic disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h / /tmp
          available=$(df -Pk /tmp | awk 'NR == 2 {print $4}')
          test "$available" -ge 2097152
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache npm dependencies
        id: npm-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - name: Install npm dependencies
        if: steps.npm-deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - name: Install Playwright operating-system dependencies
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Run Playwright e2e
        run: |
          if [ -d e2e ]; then
            npx playwright test --project='webkit-*' \
              --shard=1/1 \
              --grep-invert 'vehicle background controls preserve originals'
          else
            echo "No e2e/ directory present — skipping Playwright run."
          fi
        env:
          CI: true
          DEBUG: pw:test
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-webkit-shard-1-of-1-test-results
          path: test-results/
          retention-days: 7

  # Previous WebKit check names. Branch protection may still require them.
  # `if: false` reports each one as skipped and does not start a runner.
  # Live WebKit coverage is "Playwright webkit shard 1/1", and Playwright e2e
  # fails the main push when that job is skipped or failed.
  playwright-webkit-legacy:
    name: Playwright webkit shard ${{ matrix.shard }}/4
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - run: echo "WebKit e2e is Playwright webkit shard 1/1 on main and nightly."

  vehicle-spin-editor:
    name: Full 48-angle background editor
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache npm dependencies
        id: npm-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - name: Install npm dependencies
        if: steps.npm-deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright operating-system dependencies
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Process and correct all 48 frames with the real model
        run: >-
          npx playwright test e2e/vehicle-spin-editor.spec.ts
          --project=chromium-desktop-1440 --retries=0 --trace=off --reporter=line
        env:
          CI: true
      - name: Preserve background editor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vehicle-spin-editor
          path: test-results/
          retention-days: 7

  playwright:
    # Preserve the existing check name for branch protection.
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - typecheck-and-test
      - launch-capacity
      - automation-checks
      - playwright-chromium
      - playwright-webkit
      - vehicle-spin-editor
      - container-smoke
    if: always() && !cancelled()
    steps:
      - name: Require the lanes that gate this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
          DRAFT: ${{ needs.detect-changes.outputs.draft }}
          DETECT: ${{ needs.detect-changes.result }}
          UNIT: ${{ needs.typecheck-and-test.result }}
          SMALL_CAPACITY: ${{ needs.launch-capacity.result }}
          SMALL_AUTOMATION: ${{ needs.automation-checks.result }}
          CHROMIUM: ${{ needs.playwright-chromium.result }}
          WEBKIT: ${{ needs.playwright-webkit.result }}
          EDITOR: ${{ needs.vehicle-spin-editor.result }}
          CONTAINER: ${{ needs.container-smoke.result }}
        run: |
          set -eu
          if [ "$DETECT" != "success" ]; then
            echo "detect changed paths is $DETECT" >&2
            exit 1
          fi
          require() {
            if [ "$2" != "success" ]; then
              echo "$1 is $2" >&2
              exit 1
            fi
          }
          allow_skip() {
            if [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              echo "$1 is $2" >&2
              exit 1
            fi
          }
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only pull request; heavy checks were skipped."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            require "25 dealerships / 250 users" "$SMALL_CAPACITY"
            require "automation package (typecheck + vitest)" "$SMALL_AUTOMATION"
            echo "Draft pull request; heavy checks run when it is marked ready."
            exit 0
          fi
          case "$EVENT_NAME" in
            push|workflow_dispatch)
              require "typecheck + vitest" "$UNIT"
              require "25 dealerships / 250 users" "$SMALL_CAPACITY"
              require "automation package (typecheck + vitest)" "$SMALL_AUTOMATION"
              require "Playwright chromium" "$CHROMIUM"
              require "Playwright webkit" "$WEBKIT"
              require "Full 48-angle background editor" "$EDITOR"
              require "production container + migration and backup safety" "$CONTAINER"
              ;;
            schedule)
              require "typecheck + vitest" "$UNIT"
              require "Playwright webkit" "$WEBKIT"
              allow_skip "Playwright chromium" "$CHROMIUM"
              allow_skip "Full 48-angle background editor" "$EDITOR"
              allow_skip "production container + migration and backup safety" "$CONTAINER"
              ;;
            pull_request)
              require "typecheck + vitest" "$UNIT"
              require "25 dealerships / 250 users" "$SMALL_CAPACITY"
              require "automation package (typecheck + vitest)" "$SMALL_AUTOMATION"
              require "Playwright chromium" "$CHROMIUM"
              require "production container + migration and backup safety" "$CONTAINER"
              allow_skip "Playwright webkit" "$WEBKIT"
              allow_skip "Full 48-angle background editor" "$EDITOR"
              ;;
            *)
              echo "Unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

  container-smoke:
    name: production container + migration and backup safety
    needs: detect-changes
    if: >-
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache npm dependencies
        id: npm-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}
      - name: Install npm dependencies
        if: steps.npm-deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright operating-system dependencies
        if: steps.playwright-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            --build-arg VITE_RELEASE_SHA="$GITHUB_SHA" \
            --tag dealer-social-post-ai:ci .
          docker run --rm --entrypoint /bin/sh dealer-social-post-ai:ci \
            -c 'grep -Rqs --fixed-strings 1x00000000000000000000AA /pb/pb_public/assets'
      - name: Verify large payloads with the production HTTP client
        run: node scripts/safe-http-canary.mjs
        env:
          SAFE_HTTP_TEST_IMAGE: dealer-social-post-ai:ci
      - name: Verify bounded native media encoding under CPU pressure
        run: node scripts/website-media-encoding-canary.mjs
        env:
          MEDIA_ENCODER_TEST_IMAGE: dealer-social-post-ai:ci
      - name: Boot fresh database and verify protected routes
        run: |
          provider_stub_pid=""
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker logs "$container_id" || true
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            if [ -n "$provider_stub_pid" ]; then
              kill "$provider_stub_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          node scripts/provider-stub.mjs >/tmp/provider-stub.log 2>&1 &
          provider_stub_pid="$!"
          release_sha="ci-fresh-${GITHUB_SHA}"
          restore_verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          container_id="$(docker run --detach \
            --add-host host.docker.internal:host-gateway \
            --env GEMINI_API_KEY=test-gemini-key \
            --env ALLOW_TEST_PROVIDER_ORIGIN=true \
            --env GEMINI_API_URL_BASE=http://host.docker.internal:18081/ \
            --env ADMIN_LOGIN_USERNAME="${CI_ADMIN_LOGIN_USERNAME:-ci.admin}" \
            --env ADMIN_LOGIN_PASSWORD="${CI_ADMIN_LOGIN_PASSWORD:-CiAdmin7xQ2Z}" \
            --env SALESPERSON_PIN_PEPPER=ci-pin-pepper-0123456789abcdef0123456789 \
            --env LEGACY_CLIENT_COMPATIBILITY_ENABLED=true \
            --env POCKETBASE_R2_BACKUPS_ENABLED=true \
            --env POCKETBASE_BACKUP_LAST_VERIFIED_AT="$restore_verified_at" \
            --env POCKETBASE_BACKUP_VERIFIED_RELEASE_SHA="$release_sha" \
            --env RELEASE_SHA="$release_sha" \
            --env REVISION_OBSERVATION_EPOCH=ci-fresh \
            --env CUSTOMER_HUB_URL=https://customer-hub.example \
            --env CUSTOMER_HUB_SECRET=ci-customer-hub-secret-at-least-32-characters \
            --env CUSTOMER_HUB_DESTINATION_ID=joe_customer_hub \
            --env CUSTOMER_HUB_DEALER_ID=ci_customer_hub_dealer \
            --publish 127.0.0.1:8090:8090 \
            dealer-social-post-ai:ci)"

          for _ in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18081/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18081/ready >/dev/null

          for _ in $(seq 1 30); do
            if curl --silent --fail \
              http://127.0.0.1:8090/api/app/health \
              --output /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep --fixed-strings '"ok":true' /tmp/health.json
          grep --fixed-strings '"status":"verified"' /tmp/health.json
          node -e 'const s=require("/tmp/health.json").revisionCompatibility; if (!s || s.coverage !== "durable-deployment-window" || s.ready !== false || !Number.isFinite(Date.parse(s.eligibleAfter))) process.exit(1)'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8090/api/app/session)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8090/api/proxy/v1beta/files/not-real:download)" = "401"

          login_username="${CI_ADMIN_LOGIN_USERNAME:-ci.admin}"
          login_secret="${CI_ADMIN_LOGIN_PASSWORD:-CiAdmin7xQ2Z}"
          test "$(curl --silent --output /tmp/login.json --cookie-jar /tmp/cookies.txt \
            --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"authType\":\"admin_password\",\"username\":\"${login_username}\",\"password\":\"${login_secret}\"}" \
            http://127.0.0.1:8090/api/app/session)" = "200"
          session_cookie="$(awk '$6 == "dealer_session" { print $7 }' /tmp/cookies.txt)"
          test -n "$session_cookie"
          test "$(curl --silent --output /tmp/denied-model.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "Cookie: dealer_session=${session_cookie}" --data '{}' \
            http://127.0.0.1:8090/api/proxy/v1beta/models/not-allowlisted:generateContent)" = "403"
          grep --fixed-strings '"error":"Proxy method or path not allowed"' /tmp/denied-model.json
          if grep --fixed-strings 'Missing API path' /tmp/denied-model.json; then
            exit 1
          fi
          test "$(curl --silent --output /tmp/admin-health.json --write-out '%{http_code}' \
            --header "Cookie: dealer_session=${session_cookie}" \
            http://127.0.0.1:8090/api/app/health)" = "200"
          grep --fixed-strings '"checks"' /tmp/admin-health.json
          grep --fixed-strings '"off_box_restore_ready":true' /tmp/admin-health.json
          grep --fixed-strings '"website_integration_configured":true' /tmp/admin-health.json

          E2E_BASE_URL=http://127.0.0.1:8090 \
          E2E_REAL_POCKETBASE=true \
          E2E_ADMIN_USERNAME="$login_username" \
          E2E_ADMIN_PASSWORD="$login_secret" \
            npx playwright test e2e/real-pocketbase.spec.ts \
              --project=chromium-desktop-1440 \
              --project=webkit-desktop-1440 \
              --reporter=line

          E2E_BASE_URL=http://127.0.0.1:8090 \
          E2E_REAL_POCKETBASE=true \
          E2E_ADMIN_USERNAME="$login_username" \
          E2E_ADMIN_PASSWORD="$login_secret" \
            npm run test:spin:backend

          sensitive_event_count="$(docker exec "$container_id" sqlite3 \
            /pb/pb_data/data.db \
            "SELECT COUNT(*) FROM client_error_events WHERE name LIKE '%1HGCM82633A004352%' OR payload LIKE '%1HGCM82633A004352%' OR payload LIKE '%MustNeverPersist%';")"
          test "$sensitive_event_count" = "0"

      - name: Upgrade an existing database and preserve canary data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/dirty-upgrade-smoke.sh dealer-social-post-ai:ci "$BASE_SHA"

      - name: Create, download, and restore a full PocketBase backup
        run: bash scripts/backup-restore-canary.sh dealer-social-post-ai:ci

      - name: Preserve synthetic container browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-browser-diagnostics
          path: test-results/
          retention-days: 7
