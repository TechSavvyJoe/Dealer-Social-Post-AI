<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Create dealership-ready social posts with AI-assisted captions, branded images, video, compliance controls, and fast multi-format sharing."
    />
    <meta name="theme-color" content="#090d17" />
    <!-- Pre-paint theme: applies the persisted Sunlight Mode class before the
         first frame so light-theme users never see a dark flash. The React
         store stays the runtime authority. Plain (non-module) script so Vite
         ships it byte-identical; its sha256 is allowlisted in vercel.ts and
         guarded by __tests__/prePaintTheme.test.ts. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(
            localStorage.getItem("dealer-social-post-ai.session") || "null",
          );
          var t = s && s.theme;
          // Step 4 is the publish result, which the app always renders dark
          // (publish-studio-theme) — painting it light first would invert the
          // very flash this script exists to remove.
          var resultStep = s && s.step === 4;
          if (
            !resultStep &&
            (t === "light" ||
              (t === "system" &&
                window.matchMedia("(prefers-color-scheme: light)").matches))
          ) {
            document.documentElement.classList.add("theme-light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#f8fafc");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="application-name" content="Dealer Social Post AI" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dealer Social" />
    <!-- Link previews. The og:image must be an absolute URL on the canonical
         production origin; the 1200x630 v4 link-preview artwork is opaque and
         served immutable, so scrapers always get stable brand bytes. -->
    <meta property="og:title" content="Dealer Social Post AI" />
    <meta
      property="og:description"
      content="Create dealership-ready social posts with AI-assisted captions, branded images, video, compliance controls, and fast multi-format sharing."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dealer-social-post-ai.vercel.app/" />
    <meta
      property="og:image"
      content="https://dealer-social-post-ai.vercel.app/dealer-social-og-v4.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dealer Social Post AI mark and wordmark on a graphite background"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/dsp-brand-mark-v4-micro.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/dealer-social-favicon-v4-32.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dealer-social-dsp-v4-180.png" />
    <title>Dealer Social Post AI</title>
    <style>
      /* Critical above-the-fold styles */
      :root {
        /* CSS custom properties for safe areas - easier to use throughout */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        /* Minimum top spacing for notch devices - 44px is Apple's recommended touch target */
        --header-safe-top: max(var(--sat), 12px);
      }

      /* Mobile shell: pin to the visual viewport instead of measuring it.
         Previously html/body used `-webkit-fill-available` (iOS resolves this
         to the SMALL viewport, chrome visible) while body's `min-height` and
         .app-container used `100dvh` (the DYNAMIC viewport, which grows as
         Safari's chrome retracts). Those two models disagree during and after
         a chrome transition, which produced both reported iPhone symptoms:
         body grew taller than the visual viewport, so the document itself
         became scrollable and rubber-banded — "the app unlocks and you can
         swipe outside it" — and .app-container was sized to a dvh that no
         longer matched the real viewport, leaving a strip of body gradient
         below it — "it doesn't reach the bottom".

         `position: fixed; inset: 0` pins the shell to the visual viewport with
         no viewport units at all, so there is nothing left to disagree. With
         viewport-fit=cover this covers the full screen including behind the
         home indicator, and #root's safe-area padding keeps content clear of
         it. `interactive-widget=resizes-content` keeps the soft keyboard
         resizing this same box. Desktop restores normal document flow below. */
      html {
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        /* Must be on html too: Safari does not reliably propagate
           overscroll-behavior from body to the viewport. */
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        padding: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        max-width: 100%;
        /* inset:0 defines the box; explicit min-height:0 neutralises the
           `min-height: 100dvh` that globals.css sets in @layer base. */
        height: auto;
        min-height: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      .app-container {
        width: 100%;
        max-width: 100%;
        /* Fills the viewport-pinned body. No viewport units on mobile. */
        height: 100%;
        max-height: 100%;
        min-height: 0;
        background-color: #090d17; /* matches --color-surface-base */
        overflow: hidden;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
      }

      /* Sunlight Mode boot surface — set pre-paint by the head script. */
      .theme-light .app-container {
        background-color: #f8fafc;
      }

      #root {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        overflow: hidden;
        /* Single owner of safe-area insets (PWA + Safari) */
        padding-top: var(--header-safe-top);
        padding-bottom: max(var(--sab), 8px);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }

      /* Short landscape phones keep notch protection without spending
         unnecessary vertical space on browser chrome. */
      @media (orientation: landscape) and (max-height: 500px) {
        :root {
          --header-safe-top: max(var(--sat), 4px);
        }
        #root {
          padding-bottom: max(var(--sab), 4px);
        }
      }

      /* Desktop styles - add subtle bezel; no decorative indigo glow. */
      @media (min-width: 769px) and (min-height: 600px) {
        /* Release the mobile viewport pin so the document scrolls normally. */
        html {
          height: auto;
          overflow: visible;
          overscroll-behavior: auto;
        }
        body {
          /* `relative`, not `static`: body was a positioned ancestor before
             the mobile pin, and desktop keeps that containing block. */
          position: relative;
          inset: auto;
          overflow-x: hidden;
          overflow-y: visible;
          overscroll-behavior: auto;
          padding: clamp(1rem, 2vw, 2rem);
          height: auto;
          min-height: 100dvh;
        }
        .app-container {
          height: auto;
          max-height: none;
          min-height: calc(100dvh - clamp(2rem, 4vw, 4rem));
          overflow: visible;
          border-radius: 1.25rem;
          border: 1px solid rgba(255, 255, 255, 0.06);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        }
        #root {
          height: auto;
          overflow: visible;
          /* Desktop doesn't need safe-area padding */
          padding-top: 0;
          padding-bottom: 0;
          padding-left: 0;
          padding-right: 0;
        }
      }

      /* iPad specific optimization */
      @media (min-width: 769px) and (max-width: 1024px) and (min-height: 600px) {
        body {
          padding: clamp(0.75rem, 1.5vw, 1.25rem);
        }
        .app-container {
          border-radius: 1.25rem;
        }
      }

      /* Desktop */
      @media (min-width: 1025px) and (min-height: 600px) {
        body {
          padding: clamp(1.5rem, 2vw, 2rem);
        }
      }
    </style>
  </head>
  <body>
    <!-- Skip navigation for accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary-600 focus:text-white focus:rounded-lg focus:shadow-lg"
    >
      Skip to main content
    </a>
    <div class="app-container">
      <noscript>
        <p style="margin: auto; padding: 2rem; text-align: center; color: #e2e8f0">
          Dealer Social Post AI needs JavaScript. Please enable it and reload.
        </p>
      </noscript>
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
