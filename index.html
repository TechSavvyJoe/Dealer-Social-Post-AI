<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Create dealership-ready social posts with AI-assisted captions, branded images, video, compliance controls, and fast multi-format sharing."
    />
    <meta name="theme-color" content="#090d17" />
    <meta name="application-name" content="Dealer Social Post AI" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dealer Social" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Dealer Social Post AI</title>
    <style>
      /* Critical above-the-fold styles */
      :root {
        /* CSS custom properties for safe areas - easier to use throughout */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        /* Minimum top spacing for notch devices - 44px is Apple's recommended touch target */
        --header-safe-top: max(var(--sat), 12px);
      }

      html {
        height: 100%;
        height: -webkit-fill-available;
        width: 100%;
        max-width: 100%;
      }

      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        padding: 0;
        /* Lock to visual viewport so login cannot grow the document and scroll */
        height: 100%;
        height: -webkit-fill-available;
        min-height: 100dvh;
      }

      .app-container {
        width: 100%;
        max-width: 100%;
        /* Mobile: fixed viewport shell. Desktop media query switches to min-height. */
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        min-height: 0;
        background-color: #090d17; /* matches --color-surface-base */
        overflow: hidden;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
      }

      #root {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        overflow: hidden;
        /* Single owner of safe-area insets (PWA + Safari) */
        padding-top: var(--header-safe-top);
        padding-bottom: max(var(--sab), 8px);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }

      /* Short landscape phones keep notch protection without spending
         unnecessary vertical space on browser chrome. */
      @media (orientation: landscape) and (max-height: 500px) {
        :root {
          --header-safe-top: max(var(--sat), 4px);
        }
        #root {
          padding-bottom: max(var(--sab), 4px);
        }
      }

      /* Desktop styles - add subtle bezel; no decorative indigo glow. */
      @media (min-width: 769px) and (min-height: 600px) {
        body {
          padding: clamp(1rem, 2vw, 2rem);
          height: auto;
          min-height: 100dvh;
        }
        .app-container {
          height: auto;
          max-height: none;
          min-height: calc(100dvh - clamp(2rem, 4vw, 4rem));
          overflow: visible;
          border-radius: 1.25rem;
          border: 1px solid rgba(255, 255, 255, 0.06);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        }
        #root {
          height: auto;
          overflow: visible;
          /* Desktop doesn't need safe-area padding */
          padding-top: 0;
          padding-bottom: 0;
          padding-left: 0;
          padding-right: 0;
        }
      }

      /* iPad specific optimization */
      @media (min-width: 769px) and (max-width: 1024px) and (min-height: 600px) {
        body {
          padding: clamp(0.75rem, 1.5vw, 1.25rem);
        }
        .app-container {
          border-radius: 1.25rem;
        }
      }

      /* Desktop */
      @media (min-width: 1025px) and (min-height: 600px) {
        body {
          padding: clamp(1.5rem, 2vw, 2rem);
        }
      }
    </style>
  </head>
  <body>
    <!-- Skip navigation for accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary-600 focus:text-white focus:rounded-lg focus:shadow-lg"
    >
      Skip to main content
    </a>
    <div class="app-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
