<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="AI-powered social media post creator for car dealers"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https://vpic.nhtsa.dot.gov https://generativelanguage.googleapis.com https://*.googleapis.com https://api.openai.com https://api.anthropic.com;"
    />
    <meta name="theme-color" content="#090d17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Dealer Social" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Dealer Social Post AI</title>
    <style>
      /* Critical above-the-fold styles */
      :root {
        /* CSS custom properties for safe areas - easier to use throughout */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        /* Minimum top spacing for notch devices - 44px is Apple's recommended touch target */
        --header-safe-top: max(var(--sat), 12px);
      }

      html {
        /* Ensure proper sizing on mobile */
        height: 100%;
        height: -webkit-fill-available;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        /* On mobile, let the app handle safe areas internally for better control */
        padding: 0;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      .app-container {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #090d17; /* matches --color-surface-base */
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      #root {
        flex: 1;
        display: flex;
        flex-direction: column;
        /* Apply safe-area padding to the root container */
        padding-top: var(--header-safe-top);
        padding-bottom: max(var(--sab), 8px);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }

      /* Desktop styles - add subtle bezel; no decorative indigo glow. */
      @media (min-width: 769px) {
        body {
          padding: clamp(1rem, 2vw, 2rem);
        }
        .app-container {
          border-radius: 1.25rem;
          border: 1px solid rgba(255, 255, 255, 0.06);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
          min-height: calc(100vh - clamp(2rem, 4vw, 4rem));
          min-height: calc(100dvh - clamp(2rem, 4vw, 4rem));
        }
        #root {
          /* Desktop doesn't need safe-area padding */
          padding-top: 0;
          padding-bottom: 0;
          padding-left: 0;
          padding-right: 0;
        }
      }

      /* iPad specific optimization */
      @media (min-width: 769px) and (max-width: 1024px) {
        body {
          padding: clamp(0.75rem, 1.5vw, 1.25rem);
        }
        .app-container {
          border-radius: 1.25rem;
        }
      }

      /* Desktop */
      @media (min-width: 1025px) {
        body {
          padding: clamp(1.5rem, 2vw, 2rem);
        }
      }

    </style>
  </head>
  <body>
    <!-- Skip navigation for accessibility -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary-600 focus:text-white focus:rounded-lg focus:shadow-lg"
    >
      Skip to main content
    </a>
    <div class="app-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
