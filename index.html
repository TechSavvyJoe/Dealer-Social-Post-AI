<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AI-powered social media post creator for car dealers" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dealer Social Post AI</title>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
  /* Critical above-the-fold styles */
  body {
    margin: 0;
    overflow-x: hidden;
    padding: env(safe-area-inset-top, 1rem) env(safe-area-inset-right, 1rem) env(safe-area-inset-bottom, 1rem) env(safe-area-inset-left, 1rem);
  }

  .app-container {
    width: 100%;
    min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    background-color: #020617;
    border-radius: 1.5rem;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 0 60px rgba(59, 130, 246, 0.15),
      0 20px 40px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #root {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Mobile/Tablet specific styles */
  @media (max-width: 768px) {
    body {
      /* Keep safe-area inset for notch on mobile */
      padding: max(env(safe-area-inset-top, 0px), 0.75rem) 0 max(env(safe-area-inset-bottom, 0px), 0.5rem) 0;
    }
    .app-container {
      border-radius: 0;
      border: none;
      box-shadow: none;
      min-height: calc(100vh - max(env(safe-area-inset-top, 0px), 0.75rem) - max(env(safe-area-inset-bottom, 0px), 0.5rem));
      min-height: calc(100dvh - max(env(safe-area-inset-top, 0px), 0.75rem) - max(env(safe-area-inset-bottom, 0px), 0.5rem));
    }
  }

  /* iPad specific optimization */
  @media (min-width: 769px) and (max-width: 1024px) {
    body {
      padding: clamp(0.75rem, 1.5vw, 1.25rem);
    }
    .app-container {
      border-radius: 1.25rem;
    }
  }

  /* Desktop */
  @media (min-width: 1025px) {
    body {
      padding: clamp(1.5rem, 2vw, 2rem);
    }
  }

  /* Aurora Background Effect - Enhanced */
  .aurora-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -10;
    background-color: #020617;
    overflow: hidden;
  }

  .aurora-background::before,
  .aurora-background::after {
    content: "";
    position: absolute;
    width: 100vmin;
    height: 100vmin;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    mix-blend-mode: screen;
    animation: aurora-pulse 20s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
  }

  .aurora-background::before {
    background: radial-gradient(circle, rgba(59, 130, 246, 0.8), transparent 60%);
    top: -20%;
    left: -20%;
  }

  .aurora-background::after {
    background: radial-gradient(circle, rgba(147, 51, 234, 0.8), transparent 60%);
    bottom: -20%;
    right: -20%;
    animation-delay: -7s;
  }

  @keyframes aurora-pulse {
    0% {
      transform: scale(0.8) translate(0, 0);
      opacity: 0.15;
    }
    50% {
      opacity: 0.2;
    }
    100% {
      transform: scale(1.2) translate(50px, -50px);
      opacity: 0.15;
    }
  }
</style>
</head>
  <body>
    <div class="aurora-background"></div>
    <div class="app-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
