<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dealer Social Post AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #020617; /* slate-950 */
    overflow: hidden; /* Prevent body scroll during animations */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }

  main {
    overflow-y: auto;
  }

  .app-container {
      width: 100%;
      height: 100%;
      max-width: 428px;
      max-height: 95vh;
      background-color: #020617;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 80px rgba(79, 70, 229, 0.2);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
  }

  #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
  }

  @media (max-width: 480px), (max-height: 800px) {
      body {
          padding: 0;
      }
      .app-container {
          max-width: 100%;
          max-height: 100vh;
          border-radius: 0;
          border: none;
          box-shadow: none;
      }
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.5); /* slate-900 */
  }
  ::-webkit-scrollbar-thumb {
    background: #4f46e5; /* indigo-600 */
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #6366f1; /* indigo-500 */
  }

  /* Aurora Background Effect */
  .aurora-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -10;
    background-color: #020617; /* slate-950 */
    overflow: hidden;
  }
  .aurora-background::before,
  .aurora-background::after {
    content: "";
    position: absolute;
    width: 100vmin;
    height: 100vmin;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.2;
    mix-blend-mode: screen;
    animation: aurora-pulse 15s infinite alternate;
  }
  .aurora-background::before {
    background: radial-gradient(circle, #4f46e5, transparent 60%);
    top: -20%;
    left: -20%;
  }
  .aurora-background::after {
    background: radial-gradient(circle, #7c3aed, transparent 60%);
    bottom: -20%;
    right: -20%;
    animation-delay: -5s;
  }

  @keyframes aurora-pulse {
    0% { transform: scale(0.8) translate(0, 0); }
    100% { transform: scale(1.2) translate(50px, -50px); }
  }

  /* Fade-in Animation */
  @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
      animation: fade-in 0.5s ease-out forwards;
  }

  /* Fade-out Animation */
  @keyframes fade-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
  }
  .animate-fade-out {
      animation: fade-out 0.5s ease-in forwards;
  }
</style>
</head>
  <body>
    <div class="aurora-background"></div>
    <div class="app-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
