<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="AI-powered social media post creator for car dealers" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Dealer Social Post AI</title>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style>
  /* Critical above-the-fold styles */
  :root {
    /* CSS custom properties for safe areas - easier to use throughout */
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    /* Minimum top spacing for notch devices - 44px is Apple's recommended touch target */
    --header-safe-top: max(var(--sat), 12px);
  }

  html {
    /* Ensure proper sizing on mobile */
    height: 100%;
    height: -webkit-fill-available;
  }

  body {
    margin: 0;
    overflow-x: hidden;
    /* On mobile, let the app handle safe areas internally for better control */
    padding: 0;
    min-height: 100%;
    min-height: -webkit-fill-available;
  }

  .app-container {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: #020617;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  #root {
    flex: 1;
    display: flex;
    flex-direction: column;
    /* Apply safe-area padding to the root container */
    padding-top: var(--header-safe-top);
    padding-bottom: max(var(--sab), 8px);
    padding-left: var(--sal);
    padding-right: var(--sar);
  }

  /* Desktop styles - add decorative container */
  @media (min-width: 769px) {
    body {
      padding: clamp(1rem, 2vw, 2rem);
    }
    .app-container {
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 0 60px rgba(59, 130, 246, 0.15),
        0 20px 40px rgba(0, 0, 0, 0.3);
      min-height: calc(100vh - clamp(2rem, 4vw, 4rem));
      min-height: calc(100dvh - clamp(2rem, 4vw, 4rem));
    }
    #root {
      /* Desktop doesn't need safe-area padding */
      padding-top: 0;
      padding-bottom: 0;
      padding-left: 0;
      padding-right: 0;
    }
  }

  /* iPad specific optimization */
  @media (min-width: 769px) and (max-width: 1024px) {
    body {
      padding: clamp(0.75rem, 1.5vw, 1.25rem);
    }
    .app-container {
      border-radius: 1.25rem;
    }
  }

  /* Desktop */
  @media (min-width: 1025px) {
    body {
      padding: clamp(1.5rem, 2vw, 2rem);
    }
  }

  /* Aurora Background Effect - Enhanced */
  .aurora-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -10;
    background-color: #020617;
    overflow: hidden;
  }

  .aurora-background::before,
  .aurora-background::after {
    content: "";
    position: absolute;
    width: 100vmin;
    height: 100vmin;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    mix-blend-mode: screen;
    animation: aurora-pulse 20s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
  }

  .aurora-background::before {
    background: radial-gradient(circle, rgba(59, 130, 246, 0.8), transparent 60%);
    top: -20%;
    left: -20%;
  }

  .aurora-background::after {
    background: radial-gradient(circle, rgba(147, 51, 234, 0.8), transparent 60%);
    bottom: -20%;
    right: -20%;
    animation-delay: -7s;
  }

  @keyframes aurora-pulse {
    0% {
      transform: scale(0.8) translate(0, 0);
      opacity: 0.15;
    }
    50% {
      opacity: 0.2;
    }
    100% {
      transform: scale(1.2) translate(50px, -50px);
      opacity: 0.15;
    }
  }
</style>
</head>
  <body>
    <div class="aurora-background"></div>
    <div class="app-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
