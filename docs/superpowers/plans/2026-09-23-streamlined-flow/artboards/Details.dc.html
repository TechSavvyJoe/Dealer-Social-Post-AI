<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Details — delivery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121416;font-family:Barlow,'Helvetica Neue',Arial,sans-serif;color:#f0f2f4;-webkit-font-smoothing:antialiased}
a{color:#5582f7;text-decoration:none}a:hover{color:#618fff}
button{font:inherit;cursor:pointer}
.tile:hover{border-color:#6a737c}
.sec:hover{border-color:#b2bac2}
.pri:hover{filter:brightness(1.08)}
.rowbtn:hover{background:#2a2f34}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:56px 20px 34px;display:flex;flex-direction:column;gap:16px;background:#121416;position:relative;overflow:hidden;">
<div style="display:flex;align-items:center;justify-content:space-between;height:44px;">
<div style="display:flex;align-items:center;gap:10px;min-width:0;"><a href="Home.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:-8px;border-radius:8px;color:#f0f2f4;"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-family:'Barlow Semi Condensed',Barlow,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:17px;color:#f0f2f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Delivery</span></div>
<button type="button" aria-label="Your account" style="border:0;background:transparent;padding:0;display:flex;"><div aria-hidden="true" style="width:32px;height:32px;border-radius:999px;background:#1e40af;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',Barlow,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:13px;flex-shrink:0;">JG</div></button>
</div>
<div aria-hidden="true" style="width:100%;height:262px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%, #5f6c7a 0%, #36424d 45%, #1a2025 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);"><span style="position:absolute;right:10px;bottom:8px;font-size:11px;letter-spacing:.02em;color:rgba(255,255,255,.45);">delivery photo</span></div>
<div style="display:flex;justify-content:flex-end;margin-top:-6px;"><a href="Home.dc.html" style="font-size:14px;">Change photo</a></div>
<div style="display:flex;flex-direction:column;gap:10px;">
<sc-if value="{{signed}}" hint-placeholder-val="{{false}}"><button type="button" class="rowbtn" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:8px;background:#212529;color:#f0f2f4;text-align:left;"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#b2bac2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex:1;font-size:15px;">Customer&#39;s signature</span><span style="font-size:13px;font-weight:500;color:#5582f7;">Signed · Maria Lopez</span><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#88919a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"></path></svg></button></sc-if>
<sc-if value="{{unsigned}}" hint-placeholder-val="{{true}}">
<div style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:8px;background:#212529;"><div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:15px;">Customer&#39;s signature</span><span style="font-size:13px;font-weight:500;color:#e0aa60;">Needed</span></div><button type="button" class="sec" onClick="{{openSheet}}" style="display:flex;align-items:center;justify-content:center;gap:8px;flex:1;height:48px;border:1px solid #6a737c;border-radius:8px;background:transparent;color:#f0f2f4;font-weight:500;font-size:15px;border-color:#6a737c;">Get customer&#39;s signature</button></div>
</sc-if>
<button type="button" class="rowbtn" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:8px;background:#212529;color:#f0f2f4;text-align:left;"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#b2bac2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg><span style="flex:1;font-size:15px;">Vehicle</span><span style="font-size:13px;font-weight:500;color:#88919a;">Scan VIN · optional</span><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#88919a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"></path></svg></button>
<button type="button" class="rowbtn" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:8px;background:transparent;color:#b2bac2;text-align:left;font-size:15px;"><span style="flex:1;">Anything to mention? <span style="color:#88919a;">optional</span></span><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#88919a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;">
<sc-if value="{{unsigned}}" hint-placeholder-val="{{true}}"><span style="font-size:13px;color:#88919a;text-align:center;">Needs the customer&#39;s signature first</span><button type="button" aria-disabled="true" style="display:flex;align-items:center;justify-content:center;height:56px;border:0;border-radius:8px;background:#212529;color:#88919a;font-weight:600;font-size:16px;cursor:not-allowed;">Create post</button></sc-if>
<sc-if value="{{signed}}" hint-placeholder-val="{{false}}"><a href="Post.dc.html" class="pri" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:8px;background:#1e40af;color:#ffffff;font-weight:600;font-size:16px;">Create post</a></sc-if>
</div>
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:0;top:0;width:390px;height:844px;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;">
<div role="dialog" aria-label="Customer photo release" style="width:390px;box-sizing:border-box;padding:20px 20px 34px;border-radius:20px 20px 0 0;background:#2a2f34;display:flex;flex-direction:column;gap:16px;">
<div style="display:flex;flex-direction:column;gap:6px;"><span style="font-family:'Barlow Semi Condensed',Barlow,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:24px;line-height:28px;">Customer photo release</span><p style="margin:0;font-size:15px;line-height:22px;color:#b2bac2;">Hand the phone to your customer. They agree that Bob Maxey Ford of Howell can share this photo on its social channels and website.</p></div>
<div style="display:flex;flex-direction:column;gap:6px;"><label for="rel-name" style="font-size:13px;font-weight:500;color:#b2bac2;">Customer&#39;s full name</label><input id="rel-name" type="text" value="Maria Lopez" style="height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #6a737c;border-radius:8px;background:#212529;color:#f0f2f4;font:inherit;font-size:16px;"></div>
<div style="display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:13px;font-weight:500;color:#b2bac2;">Signature</span><a href="#" style="font-size:13px;">Type name instead</a></div><div aria-hidden="true" style="height:132px;border-radius:8px;background:#212529;border:1px dashed #6a737c;display:flex;align-items:flex-end;padding:0 18px 22px;"><svg viewBox="0 0 300 60" width="100%" height="60" fill="none" stroke="#f0f2f4" stroke-width="2" stroke-linecap="round"><path d="M8 44c18-30 30-30 24-4s-6 20 12-6 22-24 20-2-2 20 16-4 18-18 22 0 10 8 22 6 12-14 30 0 22 6 40-14 28-12 60-4"></path></svg></div></div>
<button type="button" class="pri" onClick="{{finishSign}}" style="display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border:0;border-radius:8px;background:#1e40af;color:#ffffff;font-weight:600;font-size:16px;">Done</button>
<button type="button" onClick="{{closeSheet}}" style="height:44px;border:0;background:transparent;color:#b2bac2;font-weight:500;font-size:15px;">Cancel</button>
</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { phase: "idle" }; }
  renderVals() {
    const phase = this.state.phase;
    return {
      signed: phase === "signed", unsigned: phase !== "signed", sheetOpen: phase === "sheet",
      openSheet: () => this.setState({ phase: "sheet" }),
      closeSheet: () => this.setState({ phase: "idle" }),
      finishSign: () => this.setState({ phase: "signed" }),
    };
  }
}
</script>
</body>
</html>
