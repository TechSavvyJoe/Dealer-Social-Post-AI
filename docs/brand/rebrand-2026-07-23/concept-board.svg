<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="1" stop-color="#0D2030"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#boardBg)"/>
  <circle cx="1430" cy="120" r="260" fill="#5ED3FF" opacity=".05"/>
  <circle cx="160" cy="920" r="320" fill="#FF7A59" opacity=".04"/>

  <text x="100" y="112" fill="#F7F6F2" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">Dealer Social Post AI</text>
  <text x="102" y="160" fill="#9DB0BF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500">Replacement identity directions · the real delivery moment, transformed into a social post</text>

  <!-- Concept 1 -->
  <g transform="translate(100 230)" filter="url(#shadow)">
    <rect width="430" height="610" rx="34" fill="#102739" stroke="#244359"/>
    <rect x="32" y="32" width="366" height="340" rx="26" fill="#081722"/>

    <!-- Social post / capture frame -->
    <rect x="86" y="72" width="258" height="224" rx="32" fill="none" stroke="#F7F6F2" stroke-width="12"/>

    <!-- Customer and salesperson -->
    <circle cx="149" cy="147" r="24" fill="#FF7A59"/>
    <path d="M105 225c5-43 20-63 44-63s39 20 44 63" fill="none" stroke="#FF7A59" stroke-width="20" stroke-linecap="round"/>
    <circle cx="281" cy="147" r="24" fill="#5ED3FF"/>
    <path d="M237 225c5-43 20-63 44-63s39 20 44 63" fill="none" stroke="#5ED3FF" stroke-width="20" stroke-linecap="round"/>

    <!-- Vehicle -->
    <path d="M119 230l27-41c8-12 19-18 34-18h70c15 0 26 6 34 18l27 41 15 7v35H104v-35z" fill="#F7F6F2"/>
    <path d="M163 190h104l17 31H146z" fill="#102739"/>
    <circle cx="144" cy="271" r="18" fill="#081722" stroke="#F7F6F2" stroke-width="8"/>
    <circle cx="286" cy="271" r="18" fill="#081722" stroke="#F7F6F2" stroke-width="8"/>
    <rect x="187" y="241" width="56" height="9" rx="4.5" fill="#5ED3FF"/>

    <!-- AI transformation spark -->
    <path d="M324 53l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="#5ED3FF"/>
    <circle cx="366" cy="68" r="7" fill="#FF7A59"/>

    <!-- Social post footer -->
    <circle cx="111" cy="329" r="9" fill="#FF7A59"/>
    <path d="M140 329h96M255 329h42" stroke="#6F8798" stroke-width="10" stroke-linecap="round"/>

    <text x="40" y="428" fill="#F7F6F2" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Delivery Story</text>
    <text x="40" y="467" fill="#5ED3FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">HUMAN MOMENT FIRST</text>
    <text x="40" y="514" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">Salesperson + customer + vehicle</text>
    <text x="40" y="544" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">inside the finished social post.</text>
    <rect x="40" y="575" width="143" height="3" rx="1.5" fill="#FF7A59"/>
  </g>

  <!-- Concept 2 -->
  <g transform="translate(585 230)" filter="url(#shadow)">
    <rect width="430" height="610" rx="34" fill="#102739" stroke="#244359"/>
    <rect x="32" y="32" width="366" height="340" rx="26" fill="#F7F6F2"/>

    <!-- Share card -->
    <path d="M90 83h230a26 26 0 0 1 26 26v184H116a26 26 0 0 1-26-26z" fill="#081722"/>
    <path d="M300 83h20a26 26 0 0 1 26 26v20z" fill="#5ED3FF"/>

    <!-- People as celebration witnesses -->
    <circle cx="153" cy="148" r="18" fill="#FF7A59"/>
    <circle cx="197" cy="139" r="18" fill="#5ED3FF"/>
    <path d="M125 204c4-28 14-42 28-42s24 14 28 42M169 195c4-28 14-42 28-42s24 14 28 42" fill="none" stroke-width="14" stroke-linecap="round" stroke="#F7F6F2"/>

    <!-- Side vehicle -->
    <path d="M133 233l33-34c9-9 20-13 33-13h56c12 0 23 4 32 13l20 22 20 7v29H119v-19z" fill="#F7F6F2"/>
    <path d="M181 200h69c13 0 23 3 31 12l8 9H159z" fill="#5ED3FF"/>
    <circle cx="163" cy="258" r="17" fill="#081722" stroke="#F7F6F2" stroke-width="7"/>
    <circle cx="286" cy="258" r="17" fill="#081722" stroke="#F7F6F2" stroke-width="7"/>

    <!-- Post-to-publish motion -->
    <path d="M295 314h45M326 299l15 15-15 15" fill="none" stroke="#5ED3FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M103 320h56" stroke="#FF7A59" stroke-width="9" stroke-linecap="round"/>
    <path d="M177 320h82" stroke="#A4B4BF" stroke-width="9" stroke-linecap="round"/>

    <text x="40" y="428" fill="#F7F6F2" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Post in Motion</text>
    <text x="40" y="467" fill="#5ED3FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">CAPTURE → CREATE → SHARE</text>
    <text x="40" y="514" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">A real dealership moment becomes</text>
    <text x="40" y="544" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">publish-ready content in one move.</text>
    <rect x="40" y="575" width="143" height="3" rx="1.5" fill="#5ED3FF"/>
  </g>

  <!-- Concept 3 -->
  <g transform="translate(1070 230)" filter="url(#shadow)">
    <rect width="430" height="610" rx="34" fill="#102739" stroke="#244359"/>
    <rect x="32" y="32" width="366" height="340" rx="26" fill="#081722"/>

    <!-- Editorial D / post card -->
    <path d="M104 80h100c83 0 138 49 138 112s-55 112-138 112H104z" fill="#F7F6F2"/>
    <path d="M140 116h62c57 0 96 31 96 76s-39 76-96 76h-62z" fill="#081722"/>

    <!-- Vehicle and people cut through the D -->
    <circle cx="181" cy="158" r="15" fill="#FF7A59"/>
    <circle cx="222" cy="158" r="15" fill="#5ED3FF"/>
    <path d="M156 220l24-28c7-8 16-12 27-12h33c11 0 20 4 27 12l24 28 15 7v24H141v-24z" fill="#F7F6F2"/>
    <circle cx="172" cy="251" r="14" fill="#081722" stroke="#F7F6F2" stroke-width="6"/>
    <circle cx="274" cy="251" r="14" fill="#081722" stroke="#F7F6F2" stroke-width="6"/>

    <!-- AI cut / star -->
    <path d="M311 72l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#5ED3FF"/>

    <text x="40" y="428" fill="#F7F6F2" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Moment Monogram</text>
    <text x="40" y="467" fill="#5ED3FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">DISTINCTIVE + SCALABLE</text>
    <text x="40" y="514" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">A bold post-shaped D containing</text>
    <text x="40" y="544" fill="#AAB9C5" font-family="Inter, Arial, sans-serif" font-size="18">the people-and-vehicle story.</text>
    <rect x="40" y="575" width="143" height="3" rx="1.5" fill="#FF7A59"/>
  </g>

  <text x="100" y="924" fill="#6F8798" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">All directions retain a readable full wordmark. The symbol supports the name; it does not replace the product explanation.</text>
  <text x="1500" y="924" text-anchor="end" fill="#6F8798" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">IDENTITY EXPLORATION · 23 JUL 2026</text>
</svg>
