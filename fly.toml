app = "dealer-social-post-ai-production"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Keep one machine warm — cold start + Veo 90s = a salesperson watching a
  # spinner for ~100s on the first request of the morning. Costs ~$3-5/mo
  # extra; pays for itself the first time a dealer's GM watches the demo.
  min_machines_running = 1
  processes = ["app"]

  # Liveness only: PocketBase's built-in /api/health returns 200 whenever the
  # server is up. Do NOT point this at /api/app/health — that endpoint returns
  # 503 when readiness-critical config (e.g. GEMINI_API_KEY,
  # ADMIN_DEALER_CODE) is missing, which would make Fly drop the machine from
  # rotation and blackhole ALL traffic on a configuration gap. Deep readiness
  # (ok:true) is still verified at deploy
  # time by the CI workflow and by external uptime monitors hitting /api/app/health.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # 256MB shared-cpu was OOMing under concurrent Veo / Imagen generation.
  # 1GB / shared-2x absorbs 3-5 simultaneous video generations comfortably.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
